<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmIO - Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4ECDC4 0%, #45B7D1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
        }
        h1 { color: #2C3E50; margin-bottom: 20px; font-size: 2.5rem; }
        p { color: #666; font-size: 1.1rem; margin: 15px 0; line-height: 1.6; }
        .status {
            background: #f0f8ff;
            border-left: 4px solid #4ECDC4;
            padding: 20px;
            margin: 30px 0;
            text-align: left;
        }
        .status h3 { color: #4ECDC4; margin-bottom: 10px; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4ECDC4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .check { color: #27AE60; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 FarmIO</h1>
        <p>Precision & Organic Farming Platform</p>

        <div class="spinner"></div>

        <div class="status">
            <h3>✅ Server Status</h3>
            <p><span class="check">✓</span> Backend running</p>
            <p><span class="check">✓</span> Frontend files loaded</p>
            <p><span class="check">✓</span> React initializing...</p>
        </div>

        <p>Your website is loading...</p>
        <p style="color: #999; font-size: 0.9rem;">If this page doesn't change in 5 seconds, there may be an issue.</p>

        <script>
            // Check if page loads properly
            setTimeout(function() {
                if (document.getElementById('root') === null) {
                    document.body.innerHTML += '<p style="color: #E74C3C; margin-top: 20px;"><strong>⚠️ Issue Detected:</strong> React root element not found. Please refresh the page.</p>';
                }
            }, 3000);
        </script>
    </div>
</body>
</html>
